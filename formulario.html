<body>
        <header>
            <h1>Formulario de Registro</h1>
            <nav>
                <ul>
                    <li><a href="https://educamosclm.castillalamancha.es/s/home">Inicio</a></li>
                    <li><a href="formulario.html">Formulario</a></li>

                </ul>
            </nav>
        </header>  
        <main> 
            <h1>Formulario de Registro</h1>
            <form>
                <fieldset>
                    <legend>Información Personal</legend>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required><br><br>

                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" required><br><br>

                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono"><br><br>
                </fieldset>
                <fieldset>
                    <legend>Fechas</legend>
                    <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                    <textarea name="mensaje" rows="4" cols="50" placeholder="Escribe tu mensaje aquí..."></textarea>


                </fieldset>
                <fieldset>
                    <legend></legend>
                    <label for="color_favorito">Color Favorito:</label>
                    <input type="color" id="color_favorito" name="color_favorito"><br><br>

                    <label for="archivo">Subir Archivo:</label>
                    <input type="file" id="archivo" name="archivo"><br><br>

                   

                    <label for="numero">Edad:</label>
                    <input type="number" id="numero" name="numero" min="1" max="100"><br><br>

                    <label for="url">Sitio Web:</label>
                    <input type="url" id="url" name="url"><br><br>
                     <input type="submit" value="Enviar">
                </fieldset>
                
            </form>
        </main>
        <footer>
            <p>CIFP VIRGEN DE GRACIA</p>
        </footer>

<table>

        <tr>
            

</body>
</html>
