<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora | 1 ASIR - LLMM</title>
    <link rel="stylesheet" href="css/calculadora.css">
    <link rel="stylesheet" href="css/tema.css">
    <script src="js/calculadora.js" defer></script>
    <script src="js/tema.js" defer></script>
</head>
<body>
    <header>
        <h1>1 ASIR - LLMM</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="https://educamosclm.castillalamancha.es/s/home">EducamosCLM</a></li>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="formulario.html">Formulario</a></li>
                <li><a href="piedra.html">Piedra, papel o tijera</a></li>
                <li><a href="horario.html">Horario</a></li>
                <li><a href="calculadora.html" aria-current="page">Calculadora</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="calculadora" aria-labelledby="titulo-calculadora">
            <h2 id="titulo-calculadora">Calculadora</h2>
            <input id="pantalla" class="pantalla" type="text" value="0" readonly aria-label="Resultado" aria-live="polite">
            <div class="botones">
                <button type="button" onclick="insertarNumero('7')" class="num">7</button>
                <button type="button" onclick="insertarNumero('8')" class="num">8</button>
                <button type="button" onclick="insertarNumero('9')" class="num">9</button>
                <button type="button" onclick="insertarOperador('/')" class="operator" aria-label="Dividir">÷</button>

                <button type="button" onclick="insertarNumero('4')" class="num">4</button>
                <button type="button" onclick="insertarNumero('5')" class="num">5</button>
                <button type="button" onclick="insertarNumero('6')" class="num">6</button>
                <button type="button" onclick="insertarOperador('*')" class="operator" aria-label="Multiplicar">×</button>

                <button type="button" onclick="insertarNumero('1')" class="num">1</button>
                <button type="button" onclick="insertarNumero('2')" class="num">2</button>
                <button type="button" onclick="insertarNumero('3')" class="num">3</button>
                <button type="button" onclick="insertarOperador('-')" class="operator">−</button>

                <button type="button" onclick="insertarNumero('0')" class="num">0</button>
                <button type="button" onclick="insertarNumero('.')" class="num">.</button>
                <button type="button" onclick="calcularResultado()" class="equals">=</button>
                <button type="button" onclick="insertarOperador('+')" class="operator">+</button>

                <button type="button" onclick="limpiarPantalla()" class="clear">C</button>
                <button type="button" onclick="toggleSigno()" class="utility">±</button>
                <button type="button" onclick="calcularPorcentaje()" class="utility">%</button>
                <button type="button" onclick="calcularRaizCuadrada()" class="utility" aria-label="Raíz cuadrada">√</button>

                <button type="button" onclick="eliminarNumero()" class="delete">Borrar último dígito</button>
            </div>
            <p class="ayuda">También puedes usar el teclado.</p>
        </section>
    </main>
</body>
</html>
